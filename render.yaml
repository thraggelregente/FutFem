services:
  - type: web
    name: radar-femenino-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Telegram (obligatorios para recibir alertas)
      - key: TELEGRAM_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: CHAT_ID_GRUPO
        sync: false

      # Estado y presupuesto persistentes entre deploys. Recomendado: Upstash Redis.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # API-Sports: clave opcional; límite diario por API deportiva.
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_SPORTS_DEPORTES
        value: Soccer,Basketball,Volleyball,Ice Hockey,Handball,Rugby
      - key: API_SPORTS_MAX_LIGAS
        value: "1"
      - key: API_FOOTBALL_DAILY_LIMIT
        value: "100"
      - key: API_FOOTBALL_RESERVA
        value: "12"
      # IDs de competiciÃ³n femenina para nombres neutrales. Agregar solo IDs verificados.
      - key: API_SPORTS_WOMENS_LEAGUES
        value: ""

      # Highlightly: clave opcional; cobertura de eventos y profundidad segÃºn el plan.
      - key: HIGHLIGHTLY_API_KEY
        sync: false
      - key: HIGHLIGHTLY_DEPORTES
        value: Soccer,Volleyball,Handball,Basketball,Ice Hockey
      - key: HIGHLIGHTLY_MAX_PAGINAS
        value: "1"
      - key: HIGHLIGHTLY_CACHE_MINUTES
        value: "240"
      - key: HIGHLIGHTLY_DAILY_LIMIT
        value: "100"
      - key: HIGHLIGHTLY_RESERVA
        value: "5"
      - key: HIGHLIGHTLY_RESERVA_ANALISIS
        value: "25"
      - key: HIGHLIGHTLY_WOMENS_LEAGUES
        value: ""

      # OddsPapi: solo fixtures y resultados; no se llama a /odds, /markets ni /bookmakers.
      # Plan de requests: 3 listados/dÃ­a (cada 8 h) + 1 feed diario de terminados = ~4/dÃ­a = ~120 al mes,
      # con tope propio de 180, tope semanal de 35, tope diario de 6 y 20 de reserva mensual. El mes se
      # reparte en partes iguales (nunca se gasta en pocos dÃ­as) y el estado persiste entre deploys.
      - key: ODDSPAPI_API_KEY
        sync: false
      - key: ODDSPAPI_DEPORTES
        value: Soccer,Volleyball,Handball,Basketball,Ice Hockey,Tennis,Rugby
      - key: ODDSPAPI_DAILY_LIMIT
        value: "6"
      - key: ODDSPAPI_WEEKLY_LIMIT
        value: "35"
      - key: ODDSPAPI_MONTHLY_LIMIT
        value: "180"
      - key: ODDSPAPI_RESERVA_MENSUAL
        value: "20"
      - key: ODDSPAPI_RESERVA_CUOTA_REAL
        value: "25"
      - key: ODDSPAPI_CONTROL_CUOTA_REAL
        value: "1"
      - key: ODDSPAPI_CUOTA_REAL_CACHE_HORAS
        value: "6"
      - key: ODDSPAPI_CACHE_MINUTOS
        value: "480"
      # Profundidad eficiente: 1 request/dÃ­a con los resultados de los Ãºltimos 3 dÃ­as de todos los deportes.
      - key: ODDSPAPI_HISTORIAL_DIARIO
        value: "1"
      - key: ODDSPAPI_HISTORIAL_HORAS
        value: "24"
      - key: ODDSPAPI_HISTORIAL_DIAS
        value: "3"
      # NO activar: el pedido por equipo cuesta 1 request por equipo y agotarÃ­a el mes en horas.
      - key: ODDSPAPI_PROFUNDIDAD
        value: "0"
      # Agregar solo IDs que estÃ©n verificados como torneos femeninos.
      - key: ODDSPAPI_WOMENS_TOURNAMENT_IDS
        value: ""

      # The Odds API: fixtures (/sports y /events, sin costo) y resultados (/scores, 2 crÃ©ditos por llamada).
      # No se piden cuotas ni mercados. Presupuesto propio del radar: 150 crÃ©ditos/mes (30% del plan
      # gratuito de 500), repartidos en partes iguales (~5/dÃ­a), con tope diario de 6 y reserva real de 250:
      # si el saldo REAL de la cuenta baja de 250 (por ejemplo por otro proyecto con la misma clave), el radar frena.
      - key: ODDS_API_KEY
        sync: false
      - key: THEODDSAPI_DEPORTES
        value: Soccer,Basketball,Ice Hockey,Handball,Volleyball,Rugby
      - key: THEODDSAPI_VENTANA_HORAS
        value: "30"
      - key: THEODDSAPI_CACHE_MINUTOS
        value: "45"
      - key: THEODDSAPI_RESULTADOS
        value: "1"
      - key: THEODDSAPI_CREDITOS_MES
        value: "150"
      - key: THEODDSAPI_CREDITOS_DIA
        value: "6"
      - key: THEODDSAPI_RESERVA_REAL
        value: "250"
      - key: THEODDSAPI_HORAS_ENTRE_RESULTADOS
        value: "20"
      # Competiciones femeninas verificadas que no tengan marca visible en el catÃ¡logo (opcional).
      - key: THEODDSAPI_EXTRA_SPORT_KEYS
        value: ""

      # Libro de resultados (historial por nombre y Elo). Requiere Upstash para sobrevivir a los deploys.
      - key: LIBRO_MAX_PARTIDOS
        value: "5000"
      - key: LIBRO_DIAS_RETENCION
        value: "150"
      - key: ELO_MIN_PARTIDOS
        value: "5"
      # Bajas confirmadas (ESPN /injuries) solo para ligas donde el endpoint exista; formato deporte:slug.
      - key: ESPN_LESIONES_SLUGS
        value: basketball:wnba
      # Tenis: ranking PDF oficial WTA. Contexto solo si el dataset configurado está disponible y reciente.
      - key: TENIS_CONTEXTO_ACTIVO
        value: "1"
      - key: TENIS_ANIOS
        value: "2"

      # TheSportsDB V1 gratuito usa key 123, con respuestas limitadas por endpoint.
      # Para fixtures fiables configurar IDs verificados como femeninos, por deporte.
      # Formato: Soccer:ID1,Soccer:ID2,Basketball:ID3
      - key: THESPORTSDB_KEY
        value: "123"
      - key: THESPORTSDB_WOMENS_LEAGUES
        value: "Soccer:5106,Soccer:4521,Soccer:3541,Soccer:3717,Soccer:3712,Soccer:3330"
      - key: THESPORTSDB_BUSQUEDA_GLOBAL
        value: "0"
      - key: THESPORTSDB_CACHE_MINUTOS
        value: "240"
      # Historial gratuito por equipo (eventslast/searchteams) y tope de pedidos por minuto (lÃ­mite: 30).
      - key: THESPORTSDB_HISTORIAL
        value: "1"
      - key: THESPORTSDB_MAX_PEDIDOS_MINUTO
        value: "24"

      # OpenLigaDB: gratis, sin API key; por defecto Frauen-Bundesliga de la temporada 2026.
      # Formato: shortcut:temporada; confirmar temporada/shortcut al cambiar de aÃ±o.
      - key: OPENLIGADB_WOMENS_LEAGUES
        value: "ffb1:2026"
      - key: OPENLIGADB_CACHE_MINUTOS
        value: "120"
      - key: OPENLIGADB_VENTANA_HORAS
        value: "36"

      # ESPN es respaldo de menor prioridad (Ãºnica fuente de ranking WTA); los otros proveedores van primero.
      - key: ESPN_ACTIVO
        value: "1"
      - key: ESPN_SCOREBOARD_CACHE_MINUTES
        value: "180"
      - key: ESPN_HIST_DIAS
        value: "45"

      # Frecuencia. El servicio Free de Render puede dormir si no recibe trÃ¡fico externo.
      - key: INTERVALO_REVISION
        value: "900"
      - key: HORAS_VENTANA_PREVIA
        value: "24"
      - key: MAX_ANALISIS_POR_CICLO
        value: "100"
      # Eventos solo-calendario (sin historial propio): tope de bÃºsquedas por nombre por ciclo y
      # enfriamiento tras un [sin-datos] (backoff 60 -> 120 -> 240 -> 360 min).
      - key: MAX_BUSQUEDAS_POR_NOMBRE
        value: "15"
      - key: ENFRIAMIENTO_SIN_DATOS_MIN
        value: "60"
      - key: ENFRIAMIENTO_MAX_MIN
        value: "360"
      # Fuentes oficiales nuevas: sin claves privadas. Los topes son internos del bot.
      - key: WTA_API_ACTIVO
        value: "1"
      - key: WTA_API_DIA
        value: "100"
      - key: WTA_API_SEMANA
        value: "650"
      - key: WTA_API_MES
        value: "3000"
      - key: WTA_API_MAX_POR_CICLO
        value: "16"
      - key: WTA_API_MAX_TORNEOS
        value: "4"
      - key: PWHL_ACTIVO
        value: "1"
      - key: FIVB_ACTIVO
        value: "1"
      - key: CEV_ACTIVO
        value: "1"
